<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09111f" />
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-layout" aria-label="Flappy Bird and Jev decisions">
        <div class="game-column">
          <div class="mode-switch" aria-label="Game mode">
            <button class="mode-button active" id="human-mode" data-mode="human" type="button">Human</button>
            <button class="mode-button" id="physics-mode" data-mode="physics" type="button">Jev</button>
          </div>

          <div class="game-card">
            <div class="canvas-wrap">
              <canvas id="game" width="540" height="720" aria-label="Flappy Bird game"></canvas>
              <div class="game-hud">
                <div><span class="hud-label">Score</span><strong id="score">0</strong></div>
                <div class="hud-right"><span class="run-status" id="run-status">Ready</span></div>
              </div>
              <div class="start-overlay" id="start-overlay">
                <div class="overlay-card">
                  <span class="overlay-kicker" id="overlay-kicker">Human</span>
                  <h1 class="game-title" id="overlay-title">FLAPPY BIRD</h1>
                  <p id="overlay-copy">Tap or press Space to flap.</p>
                  <button class="primary-button" id="start-button">Start</button>
                </div>
              </div>
            </div>
          </div>
          <p class="control-hint" id="control-hint"><kbd>Space</kbd> or click to flap</p>
        </div>

        <aside class="jev-panel" aria-label="Jev request and response">
          <section class="decision-block">
            <h2>Sent to Jev</h2>
            <p class="decision-question" id="jev-question">Should the bird flap now or wait?</p>
            <p class="decision-state" id="jev-state">Waiting for a Jev request</p>
            <p class="decision-state" id="jev-choices">Choices: flap · wait</p>
          </section>
          <section class="decision-block response-block">
            <h2>Jev response</h2>
            <p class="decision-action" id="jev-action">-</p>
            <div class="probabilities" id="jev-probabilities" aria-live="polite">Probabilities: -</div>
          </section>
        </aside>
      </section>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
